<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>家計簿</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>家計簿</h1>
  </header>

  <nav class="tabs" aria-label="画面の切り替え">
    <button type="button" class="tab" data-view="entry">入力</button>
    <button type="button" class="tab" data-view="settings">設定</button>
    <button type="button" class="tab" data-view="camera">カメラ確認</button>
  </nav>

  <main>
    <!-- 入力（Phase 4 のレシート確認画面と共通） -->
    <section id="view-entry" class="view" hidden>
      <form id="entry-form" novalidate autocomplete="off">
        <div class="field">
          <label for="entry-date">日付</label>
          <input id="entry-date" name="date" type="date" required>
          <p class="field-error" data-error-for="date"></p>
        </div>
        <div class="field">
          <label for="entry-amount">金額（円）</label>
          <input id="entry-amount" name="amount" type="text" inputmode="numeric" placeholder="0" required>
          <p class="field-error" data-error-for="amount"></p>
        </div>
        <div class="field">
          <label for="entry-store">店名</label>
          <input id="entry-store" name="store" type="text" maxlength="200">
          <p class="field-error" data-error-for="store"></p>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="entry-category">カテゴリ</label>
            <select id="entry-category" name="category"></select>
          </div>
          <div class="field">
            <label for="entry-payment">支払方法</label>
            <select id="entry-payment" name="payment"></select>
          </div>
        </div>
        <div class="field">
          <label for="entry-memo">メモ</label>
          <textarea id="entry-memo" name="memo" rows="2" maxlength="1000"></textarea>
          <p class="field-error" data-error-for="memo"></p>
        </div>
        <button type="submit" class="primary">保存</button>
        <p class="status" id="entry-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- 設定（この端末の localStorage にだけ保存する） -->
    <section id="view-settings" class="view" hidden>
      <p class="notice" id="settings-notice" hidden>最初に GAS の URL と合言葉（トークン）を設定してください。</p>
      <form id="settings-form" novalidate autocomplete="off">
        <div class="field">
          <label for="settings-url">GAS の URL（/exec で終わるもの）</label>
          <input id="settings-url" name="url" type="url" inputmode="url" autocapitalize="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="settings-token">合言葉（トークン）</label>
          <input id="settings-token" name="token" type="password" autocapitalize="off" spellcheck="false">
        </div>
        <div class="button-row">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="settings-test">接続テスト</button>
        </div>
        <p class="status" id="settings-status" role="status" aria-live="polite"></p>
      </form>
      <p class="hint">
        設定はこの端末のこのアプリの中にだけ保存されます。ホーム画面から開いたアプリと Safari は保存先が別なので、
        ホーム画面に追加したあとは、アプリを開いてから設定してください。
      </p>
    </section>

    <!-- カメラ確認（画像は送信しない） -->
    <section id="view-camera" class="view" hidden>
      <p>撮影または写真の選択ができるかを確認する画面です。選んだ画像はこの端末に表示するだけで、どこにも送信しません。</p>
      <label class="file-button">
        <input id="camera-input" type="file" accept="image/*">
        <span>撮影する／写真を選ぶ</span>
      </label>
      <p class="status" id="camera-status" role="status" aria-live="polite"></p>
      <img id="camera-preview" class="preview" alt="選んだ画像のプレビュー" hidden>
    </section>
  </main>
</body>
</html>
